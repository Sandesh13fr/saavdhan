<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">How Saavdhan decides</title>
  <desc id="desc">Four steps. 1, paste a chat or upload an offer in English, Hindi or Marathi. 2, extract every fact with its quoted line; an optional LLM may only extract and must quote verbatim. 3, twelve rules run on both readings and the stricter result per rule wins. 4, Python sets the verdict, STOP or VERIFY FIRST, never an all-clear. If the person still travels, a check-in net sends a simulated family alert, and anonymised reports feed a district pattern map.</desc>

  <rect width="1200" height="420" rx="28" fill="#F4F4F0"/>
  <text x="48" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#55554F">MODELS EXTRACT · PYTHON DECIDES</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <!-- 1 -->
    <g transform="translate(48 88)">
      <rect width="258" height="200" rx="22" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="2"/>
      <text x="22" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#C62828">01</text>
      <text x="22" y="86" font-size="26" font-weight="700" fill="#111111">Paste or upload</text>
      <text x="22" y="122" font-size="20" fill="#55554F">Chat text, letter,</text>
      <text x="22" y="148" font-size="20" fill="#55554F">ad or screenshot</text>
      <text x="22" y="180" font-family="'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="20" fill="#111111">EN · हिंदी · मराठी</text>
    </g>
    <path d="M310 188H334" stroke="#C62828" stroke-width="3"/><path d="M328 180L338 188L328 196" fill="none" stroke="#C62828" stroke-width="3"/>
    <!-- 2 -->
    <g transform="translate(342 88)">
      <rect width="258" height="200" rx="22" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="2"/>
      <text x="22" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#C62828">02</text>
      <text x="22" y="86" font-size="26" font-weight="700" fill="#111111">Extract facts</text>
      <text x="22" y="122" font-size="20" fill="#55554F">Each fact keeps its</text>
      <text x="22" y="148" font-size="20" fill="#55554F">quote and line</text>
      <text x="22" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#C62828">◂ L4 "Rs 2,50,000"</text>
    </g>
    <path d="M604 188H628" stroke="#C62828" stroke-width="3"/><path d="M622 180L632 188L622 196" fill="none" stroke="#C62828" stroke-width="3"/>
    <!-- 3 -->
    <g transform="translate(636 88)">
      <rect width="258" height="200" rx="22" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="2"/>
      <text x="22" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#C62828">03</text>
      <text x="22" y="86" font-size="26" font-weight="700" fill="#111111">Run 12 rules</text>
      <text x="22" y="122" font-size="20" fill="#55554F">On both readings;</text>
      <text x="22" y="148" font-size="20" fill="#55554F">stricter result wins</text>
      <text x="22" y="180" font-size="20" fill="#55554F">Unknown ≠ clear</text>
    </g>
    <path d="M898 188H922" stroke="#C62828" stroke-width="3"/><path d="M916 180L926 188L916 196" fill="none" stroke="#C62828" stroke-width="3"/>
    <!-- 4 -->
    <g transform="translate(930 88)">
      <rect width="222" height="200" rx="22" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="2"/>
      <text x="22" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#C62828">04</text>
      <text x="22" y="86" font-size="26" font-weight="700" fill="#111111">Verdict</text>
      <rect x="22" y="104" width="94" height="34" rx="17" fill="#C62828"/>
      <text x="69" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">STOP</text>
      <rect x="22" y="146" width="168" height="34" rx="17" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
      <text x="106" y="170" text-anchor="middle" font-size="20" font-weight="800" fill="#C62828">VERIFY FIRST</text>
    </g>

    <!-- after the verdict -->
    <g transform="translate(48 316)">
      <rect width="1104" height="72" rx="22" fill="#111111"/>
      <text x="28" y="45" font-size="22" font-weight="700" fill="#F4F4F0">Never an all-clear.</text>
      <text x="232" y="45" font-size="21" fill="#E2E2DC">If they still go: family check-ins with a simulated alert · anonymised district map</text>
    </g>
  </g>
</svg>
