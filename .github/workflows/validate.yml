name: Validate Saavdhan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: No "safe" wording in app code or copy
        run: |
          if grep -rniwE 'safe|सुरक्षित|सुरक्षीत' backend frontend/src --include=*.py --include=*.ts --include=*.tsx --include=*.json; then
            echo "Product rule: never say 'safe'"; exit 1
          fi
      - run: pip install -r requirements.lock.txt
      - run: python -m pytest tests -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
